
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عالم قيس التعليمي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f0f6ff;color:#17345c}
header{background:linear-gradient(135deg,#1769ff,#7545df);color:white;text-align:center;padding:25px 12px;border-radius:0 0 25px 25px}
header h1{margin:8px;font-size:30px}
main{max-width:650px;margin:auto;padding:16px}
.card{background:white;padding:18px;border-radius:20px;margin:14px 0;box-shadow:0 4px 15px #17345c12}
.mascot{font-size:58px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font-size:16px;cursor:pointer;border:0;border-radius:15px;padding:14px;background:#e5efff;color:#17345c}
button:active{transform:scale(.98)}
.menu{min-height:110px;font-weight:bold}
.menu span{display:block;font-size:32px;margin-bottom:8px}
.primary{background:#1769ff;color:white;margin:5px}
#content{display:none}
#choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#choices button{min-width:90px}
video{width:100%;border-radius:12px;background:#111}
footer{text-align:center;padding:22px;color:#65758b}
</style>
</head>
<body>
<header>
<div style="font-size:38px">🌍</div>
<h1>عالم قيس</h1>
<p>Qais World · تعلم الإنجليزية بالمرح ⭐</p>
<p>Let's Go 1</p>
</header>
<main>
<section class="card" style="text-align:center">
<div class="mascot">🤖</div>
<h2>أهلًا يا بطل!</h2>
<p>هيا نتعلم الإنجليزية معًا!</p>
<button class="primary" onclick="openSection('lessons')">ابدأ التعلم 🚀</button>
</section>
<h2>اختر نشاطك 🎯</h2>
<div class="grid">
<button class="menu" onclick="openSection('lessons')"><span>📚</span>الدروس</button>
<button class="menu" onclick="openSection('game')"><span>🎮</span>لعبة الكلمات</button>
<button class="menu" onclick="openSection('videos')"><span>🎬</span>الفيديوهات</button>
<button class="menu" onclick="openSection('listen')"><span>🔊</span>استمع وتعلّم</button>
</div>
<section id="content" class="card">
<h2 id="title"></h2>
<div id="body"></div>
<button class="primary" onclick="closeSection()">العودة للقائمة ↩</button>
</section>
</main>
<footer>عالم قيس التعليمي ❤️</footer>
<script>
const words=[
{en:"Sun",ar:"شمس",emoji:"☀️"},
{en:"Apple",ar:"تفاحة",emoji:"🍎"},
{en:"Cat",ar:"قطة",emoji:"🐱"},
{en:"Book",ar:"كتاب",emoji:"📘"},
{en:"Dog",ar:"كلب",emoji:"🐶"},
{en:"Hello",ar:"مرحبًا",emoji:"👋"}
];
let current=0,score=0;
function openSection(section){
const panel=document.getElementById("content");
const title=document.getElementById("title");
const body=document.getElementById("body");
panel.style.display="block";
if(section==="lessons"){
title.textContent="📚 الدروس";
body.innerHTML="<p>اختر كلمة لتتعلم معناها ونطقها.</p><div class='grid' id='lessonWords'></div>";
words.forEach((w,i)=>{
const b=document.createElement("button");
b.textContent=w.emoji+" "+w.en;
b.onclick=()=>{current=i;openSection("listen")};
document.getElementById("lessonWords").appendChild(b);
});
}
if(section==="game"){current=0;score=0;gameQuestion()}
if(section==="listen"){
const w=words[current%words.length];
title.textContent="🔊 استمع وتعلّم";
body.innerHTML="<div style='text-align:center;font-size:45px'>"+w.emoji+"</div><h2 style='text-align:center;direction:ltr'>"+w.en+"</h2><p style='text-align:center'>المعنى: "+w.ar+"</p><div style='text-align:center'><button class='primary' id='say'>🔊 استمع للنطق</button><button class='primary' id='next'>الكلمة التالية ➜</button></div>";
document.getElementById("say").onclick=()=>speak(w.en);
document.getElementById("next").onclick=()=>{current=(current+1)%words.length;openSection("listen")};
}
if(section==="videos"){
title.textContent="🎬 الفيديوهات التعليمية";
body.innerHTML="<p>شاهد الفيديو التجريبي التالي. إذا لم يعمل داخل الصفحة، افتحه من YouTube أو استخدم فيديو مناسبًا من جهازك.</p><iframe width='100%' height='220' style='border:0;border-radius:12px' src='https://www.youtube-nocookie.com/embed/2t1NMRse6aI' title='English learning video' allowfullscreen></iframe><p>سنضيف قائمة منظمة لفيديوهات كل درس في المرحلة التالية.</p>";
}
panel.scrollIntoView({behavior:"smooth"});
}
function gameQuestion(){
const w=words[current%words.length];
document.getElementById("title").textContent="🎮 لعبة الكلمات";
const wrong1=words[(current+1)%words.length].ar;
const wrong2=words[(current+2)%words.length].ar;
const opts=[w.ar,wrong1,wrong2].sort(()=>Math.random()-.5);
document.getElementById("body").innerHTML="<p>النقاط: "+score+" ⭐</p><h3 style='text-align:center;direction:ltr'>ما معنى "+w.en+"؟ "+w.emoji+"</h3><div id='choices'></div><p id='feedback' style='text-align:center'></p><div style='text-align:center'><button class='primary' id='nextQ'>السؤال التالي ➜</button></div>";
opts.forEach(opt=>{
const b=document.createElement("button");b.textContent=opt;
b.onclick=()=>{
document.getElementById("feedback").textContent=opt===w.ar?"أحسنت! إجابة صحيحة ⭐":"حاول مرة أخرى 💪";
if(opt===w.ar){score++;document.getElementById("body").querySelector("p").textContent="النقاط: "+score+" ⭐"}
};
document.getElementById("choices").appendChild(b);
});
document.getElementById("nextQ").onclick=()=>{current=(current+1)%words.length;gameQuestion()};
}
function speak(text){
if("speechSynthesis" in window){
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);
u.lang="en-US";u.rate=.8;speechSynthesis.speak(u);
}else alert("ميزة النطق غير متاحة في هذا المتصفح.");
}
function closeSection(){document.getElementById("content").style.display="none";window.scrollTo({top:0,behavior:"smooth"})}
</script>
</body>
</html>
